<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Paula María Bonilla Muñoz">
    <meta name="description" content="Formulario de contacto del restaurante Donna">
    <meta name="keywords" content="Donna, restaurante, contacto">
    <title>Contacto - Restaurante Donna</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 25px auto; padding: 0 18px; line-height: 1.5; color: #000; background: #fff; }
        header, nav, main, footer { margin-bottom: 22px; }
        header { border-bottom: 2px solid #000; padding-bottom: 10px; }
        nav { border-bottom: 1px solid #777; padding-bottom: 12px; }
        section { margin: 28px 0; }
        fieldset { border: 1px solid #555; padding: 16px; margin: 18px 0; }
        legend { font-weight: bold; padding: 0 6px; }
        label { display: block; margin: 10px 0 4px; }
        input:not([type="radio"]):not([type="checkbox"]), select, textarea { box-sizing: border-box; max-width: 100%; padding: 7px; border: 1px solid #555; }
        input:not([type="radio"]):not([type="checkbox"]), textarea { width: 100%; }
        input[type="radio"], input[type="checkbox"] { margin-right: 6px; }
        label:has(input[type="radio"]), label:has(input[type="checkbox"]) { display: inline-block; margin-right: 12px; }
        button { padding: 8px 14px; margin: 8px 8px 0 0; border: 1px solid #000; background: #fff; color: #000; cursor: pointer; }
        footer { border-top: 1px solid #777; padding-top: 12px; }
    </style>

</head>
<body>
<header><h1>Contacta con Donna</h1></header>
<nav>
    <a href="../Restaurante Donna.html">Volver al restaurante</a> |
    <a href="../../index.html">Menú principal</a>
</nav>
<main>
    <form action="#" method="get">
        <fieldset>
            <legend>Datos de contacto</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>
            <label for="asunto">Asunto:</label>
            <input type="text" id="asunto" name="asunto" required>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="6" cols="40" required></textarea>
        </fieldset>
        <button type="submit">Enviar mensaje</button>
        <button type="reset">Borrar</button>
    </form>
</main>
<footer><p>Restaurante Donna</p></footer>
</body>
</html>
